<!-- public/index.html -->
<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11121a">
<title>Finbuu</title>
<style>
  :root{--bg:#1b1d2a;--panel:#262a3d;--bar:#11121a;--accent:#4caf50;--text:#eee;--radius:12px;--nav-h:64px}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
  button,input,select,textarea{font:inherit;color:inherit;background:#33384f;border:0;border-radius:8px;padding:10px 12px;min-height:44px}
  button{cursor:pointer;background:#3a4060;transition:background .15s,transform .05s}
  button:hover{background:#4a5175} button:active{transform:scale(.97)}
  button.primary{background:var(--accent);color:#08140a;font-weight:600}
  button.lockedBtn{filter:blur(.7px);opacity:.55;position:relative}
  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:var(--bar)}
  header h1{font-size:1.05rem;margin:0;white-space:nowrap}
  #day{font-size:.75rem;opacity:.75;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #me{font-size:.85rem;background:#2b3047;padding:6px 10px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50vw}
  #menuBtn{font-size:1.3rem;padding:6px 12px}
  #roomBar{display:none;gap:8px;align-items:center;padding:6px 12px;background:#20243a;font-size:.85rem;flex-wrap:wrap}
  #roomBar button{min-height:34px;padding:6px 10px}
  main{display:grid;grid-template-columns:1fr 340px;gap:12px;padding:12px;height:calc(100% - 60px)}
  #stage{position:relative;background:#7ec8ff;border-radius:var(--radius);overflow:hidden;min-height:320px;touch-action:pan-y}
  canvas{display:block;width:100%;height:100%;cursor:pointer}
  .navArrow{position:absolute;top:50%;transform:translateY(-50%);font-size:1.4rem;background:#000a;width:48px;height:48px;border-radius:50%;padding:0}
  #left{left:8px} #right{right:8px}
  #hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:.75rem;background:#0008;padding:4px 10px;border-radius:999px;white-space:nowrap}
  #side{display:flex;flex-direction:column;gap:12px;overflow:auto}
  .card{background:var(--panel);border-radius:var(--radius);padding:12px}
  .card h3,.card h4{margin:0 0 8px;font-size:1rem}
  .card ul,.card ol{margin:0;padding-left:18px;font-size:.9rem;line-height:1.5}
  #log{list-style:none;padding:0} #log li{padding:4px 0;border-bottom:1px solid #ffffff10}
  .locked{filter:blur(.6px);opacity:.55;display:inline-block;margin:3px;padding:6px 10px;background:#555;border-radius:999px;font-size:.8rem;cursor:pointer}
  .row{display:flex;gap:8px;flex-wrap:wrap} .row>*{flex:1 1 auto}
  textarea{width:100%;resize:vertical;min-height:70px}
  .stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #ffffff10}
  .bar{height:8px;background:#33384f;border-radius:4px;overflow:hidden;margin-top:4px}.bar>i{display:block;height:100%;background:var(--accent)}
  #drawer{position:fixed;inset:0 0 0 auto;width:min(320px,85vw);background:var(--bar);z-index:40;padding:16px;padding-top:max(16px,env(safe-area-inset-top));transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;gap:10px}
  #drawer.open{transform:none}
  #scrim{position:fixed;inset:0;background:#0008;z-index:30;display:none} #scrim.show{display:block}
  #drawer label{font-size:.8rem;opacity:.7}
  #modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50}
  #modalBody{width:min(460px,92vw);max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
  .mode{border:2px solid #3a4060;border-radius:var(--radius);padding:10px;display:flex;flex-direction:column;gap:6px}
  .mode p{margin:0;font-size:.85rem;opacity:.8}
  .mode.disabled{filter:blur(.8px);opacity:.5}
  #toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#000d;padding:10px 16px;border-radius:999px;z-index:60;display:none;max-width:90vw;text-align:center}
  nav{display:none}
  @media (max-width:820px){
    main{display:block;padding:0;height:auto}
    #stage{border-radius:0;height:calc(100dvh - 60px - var(--nav-h));min-height:260px}
    #side{position:fixed;left:0;right:0;bottom:var(--nav-h);max-height:60dvh;background:var(--bg);border-radius:var(--radius) var(--radius) 0 0;padding:12px;z-index:25;transform:translateY(110%);transition:transform .25s;box-shadow:0 -8px 24px #0008}
    #side.open{transform:none}
    #side .card{display:none} #side .card.active{display:block}
    nav{display:flex;position:fixed;left:0;right:0;bottom:0;height:var(--nav-h);padding-bottom:env(safe-area-inset-bottom);background:var(--bar);z-index:26}
    nav button{flex:1;background:none;border-radius:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.7rem;min-height:0;padding:4px}
    nav button span{font-size:1.3rem} nav button.active{color:var(--accent)}
    #modal{align-items:flex-end}
    #modalBody{width:100%;border-radius:var(--radius) var(--radius) 0 0;padding-bottom:max(16px,env(safe-area-inset-bottom))}
    #modalBody button{width:100%}
    #day{display:none}
  }
</style>
</head>
<body>
<header>
  <h1 data-i18n="ui.title"></h1>
  <span id="day"></span>
  <span id="me"></span>
  <button id="menuBtn" aria-label="Menu">☰</button>
</header>
<div id="roomBar"><b id="roomInfo"></b><button id="copyLink" data-i18n="ui.copyLink"></button></div>

<main>
  <section id="stage">
    <canvas id="cv"></canvas>
    <button class="navArrow" id="left" aria-label="Left">◀</button>
    <button class="navArrow" id="right" aria-label="Right">▶</button>
    <span id="hint" data-i18n="ui.swipeHint"></span>
  </section>
  <aside id="side">
    <div class="card" data-panel="profile"><h3 data-i18n="ui.profile"></h3><div id="profile"></div></div>
    <div class="card" data-panel="guide"><h3 data-i18n="ui.guide"></h3><ol id="tut"></ol>
      <h3 style="margin-top:12px" data-i18n="ui.premium"></h3><div id="locked"></div></div>
    <div class="card" data-panel="ideas"><h3 data-i18n="ui.ideaBox"></h3>
      <textarea id="ideaText" maxlength="500" data-i18n-ph="ui.ideaPh"></textarea>
      <div class="row" style="margin:8px 0">
        <button id="sendText" class="primary" data-i18n="ui.sendText"></button>
        <button id="recAudio" class="lockedBtn"></button>
        <button id="recVideo" class="lockedBtn"></button>
      </div>
      <ul id="ideas"></ul></div>
    <div class="card" data-panel="events"><h3 data-i18n="ui.events"></h3><ul id="log"></ul></div>
  </aside>
</main>

<nav>
  <button data-tab="street" class="active"><span>🏙</span><b data-i18n="ui.tabStreet"></b></button>
  <button data-tab="profile"><span>👤</span><b data-i18n="ui.tabProfile"></b></button>
  <button data-tab="guide"><span>📘</span><b data-i18n="ui.tabGuide"></b></button>
  <button data-tab="ideas"><span>💡</span><b data-i18n="ui.tabIdeas"></b></button>
  <button data-tab="events"><span>📰</span><b data-i18n="ui.tabEvents"></b></button>
  <button data-tab="menu"><span>☰</span><b data-i18n="ui.menu"></b></button>
</nav>

<div id="scrim"></div>
<div id="drawer">
  <h3 data-i18n="ui.settings"></h3>
  <label data-i18n="ui.language"></label>
  <select id="lang"><option value="tr">Türkçe</option><option value="en">English</option></select>
  <button id="openModes" class="primary" data-i18n="ui.modeTitle"></button>
  <button id="closeDrawer" data-i18n="ui.close"></button>
</div>

<div id="modal"><div class="card" id="modalBody"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/i18next@23/i18next.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
const $ = id => document.getElementById(id);
const el = (tag, text) => { const e = document.createElement(tag); if (text != null) e.textContent = text; return e; };
const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage');
let seed = null, state = null, camX = 0, viewW = 0, viewH = 0, joined = null;
const LOT_W = 160, GAP = 20, LOTS_X = 300;
const t = (k, o) => (i18next.isInitialized ? i18next.t(k, { interpolation: { escapeValue: false }, ...o }) : k);
const resolve = p => { const out = { ...p }; for (const [k, v] of Object.entries(p || {})) if (k.endsWith('Key')) out[k.slice(0, -3)] = t(v); return out; };
const companyName = c => c.name || t(c.nameKey);
const worldWidth = () => LOTS_X + (state?.lots.length || 12) * (LOT_W + GAP) + 400;
const clampCam = () => (camX = Math.max(0, Math.min(camX, Math.max(0, worldWidth() - viewW))));
const myId = () => socket.id;

function toast(msg) {
  const tEl = $('toast'); tEl.textContent = msg; tEl.style.display = 'block';
  clearTimeout(toast.timer); toast.timer = setTimeout(() => (tEl.style.display = 'none'), 3500);
}

// ---------- i18n ----------
async function loadLang(lng) {
  if (!i18next.hasResourceBundle(lng, 'translation')) i18next.addResourceBundle(lng, 'translation', await fetch(`/locales/${lng}.json`).then(r => r.json()));
  await i18next.changeLanguage(lng);
  localStorage.setItem('lang', lng); document.documentElement.lang = lng;
  document.title = t('ui.title');
  document.querySelectorAll('[data-i18n]').forEach(e => (e.textContent = t(e.dataset.i18n)));
  document.querySelectorAll('[data-i18n-ph]').forEach(e => (e.placeholder = t(e.dataset.i18nPh)));
  $('recAudio').textContent = '☁🔒 ' + t('ui.recAudio');
  $('recVideo').textContent = '☁🔒 ' + t('ui.recVideo');
  renderSeed(); renderRoomBar(); render();
}
function renderSeed() {
  if (!seed || !i18next.isInitialized) return;
  $('tut').replaceChildren(...seed.tutorial.map(k => el('li', t(k))));
  $('locked').replaceChildren(...seed.locked.map(k => { const s = el('span', '☁🔒 ' + t(k)); s.className = 'locked'; s.onclick = () => toast(t('ui.premiumAlert', { feature: t(k) })); return s; }));
}

// ---------- Navigation ----------
const openDrawer = v => { $('drawer').classList.toggle('open', v); $('scrim').classList.toggle('show', v); };
$('menuBtn').onclick = () => openDrawer(true);
$('closeDrawer').onclick = $('scrim').onclick = () => openDrawer(false);
$('openModes').onclick = () => { openDrawer(false); showModes(); };
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  const tab = b.dataset.tab;
  if (tab === 'menu') return openDrawer(true);
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x === b));
  $('side').classList.toggle('open', tab !== 'street');
  document.querySelectorAll('#side .card').forEach(c => c.classList.toggle('active', c.dataset.panel === tab));
});
$('lang').onchange = e => loadLang(e.target.value);
$('recAudio').onclick = () => toast(t('ui.premiumAlert', { feature: t('locked.mediaIdeas') }));
$('recVideo').onclick = () => toast(t('ui.premiumAlert', { feature: t('locked.mediaIdeas') }));

// ---------- Socket ----------
const socket = io();
socket.on('seed', s => { seed = s; renderSeed(); });
socket.on('state', s => { state = s; render(); });
socket.on('toast', k => toast(t(k)));
socket.on('announce', msg => toast(`${t('ui.announce')}: ${msg}`));
socket.on('joined', info => {
  joined = info;
  if (info.mode === 'multiplayer') history.replaceState(null, '', `?room=${encodeURIComponent(info.roomId)}`);
  closeModal(); renderRoomBar();
});
socket.on('disconnect', () => { joined = null; state = null; renderRoomBar(); render(); });

function renderRoomBar() {
  const show = joined?.mode === 'multiplayer';
  $('roomBar').style.display = show ? 'flex' : 'none';
  if (show) $('roomInfo').textContent = t('ui.roomInfo', { room: joined.roomId, pin: joined.pin });
}
$('copyLink').onclick = async () => {
  const link = `${location.origin}/?room=${encodeURIComponent(joined.roomId)}`;
  try { await navigator.clipboard.writeText(link); toast(t('ui.copied')); } catch { prompt(t('ui.copyLink'), link); }
};

// ---------- Mode selection ----------
function showModes() {
  if (joined) return toast(t('ui.roomInfo', { room: joined.roomId, pin: joined.pin || '—' }));
  const urlRoom = new URLSearchParams(location.search).get('room') || '';
  openModal(body => {
    body.append(el('h3', t('ui.modeTitle')));
    const name = el('input'); name.placeholder = t('ui.namePh'); name.maxLength = 20; body.append(name);

    const solo = el('div'); solo.className = 'mode';
    solo.append(el('b', t('ui.solo')), el('p', t('ui.soloDesc')));
    const soloBtn = el('button', t('ui.startSolo')); soloBtn.className = 'primary';
    soloBtn.onclick = () => socket.emit('startSolo', { name: name.value });
    solo.append(soloBtn); body.append(solo);

    const multi = el('div'); multi.className = 'mode';
    multi.append(el('b', t('ui.multi')), el('p', t('ui.multiDesc')));
    const create = el('button', t('ui.createRoom')); create.className = 'primary';
    create.onclick = () => socket.emit('createRoom', { name: name.value });
    const rid = el('input'); rid.placeholder = t('ui.roomIdPh'); rid.value = urlRoom; rid.maxLength = 20;
    const pin = el('input'); pin.placeholder = t('ui.pinPh'); pin.inputMode = 'numeric'; pin.maxLength = 4; pin.pattern = '[0-9]*';
    const joinBtn = el('button', t('ui.joinRoom'));
    joinBtn.onclick = () => socket.emit('joinRoom', { roomId: rid.value.trim(), pin: pin.value.trim(), name: name.value });
    multi.append(create, rid, pin, joinBtn); body.append(multi);

    const online = el('div'); online.className = 'mode disabled';
    online.append(el('b', '☁🔒 ' + t('ui.online')), el('p', t('ui.onlineDesc')));
    online.onclick = () => socket.emit('startOnline');
    body.append(online);
    if (urlRoom) setTimeout(() => pin.focus(), 50);
  }, { closable: false });
}

// ---------- Canvas ----------
function resize() {
  const r = stage.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  viewW = r.width; viewH = r.height;
  cv.width = viewW * dpr; cv.height = viewH * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  clampCam(); draw();
}
new ResizeObserver(resize).observe(stage);
const pan = dx => { camX += dx; clampCam(); draw(); };
$('left').onclick = () => pan(-viewW * 0.6);
$('right').onclick = () => pan(viewW * 0.6);
addEventListener('keydown', e => {
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
  if (e.key === 'ArrowRight') pan(40);
  if (e.key === 'ArrowLeft') pan(-40);
});
let drag = null;
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, cam: camX, moved: false }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  if (Math.abs(dx) > 6) drag.moved = true;
  if (drag.moved) { camX = drag.cam - dx; clampCam(); draw(); }
});
cv.addEventListener('pointerup', e => { const tap = drag && !drag.moved; drag = null; if (tap) onTap(e); });
cv.addEventListener('wheel', e => { e.preventDefault(); pan(e.deltaY + e.deltaX); }, { passive: false });

// ---------- Render ----------
function render() {
  if (!i18next.isInitialized) return;
  const me = state?.players[myId()];
  $('me').textContent = me ? `${me.name} · 💰 ${me.coins} · Lv ${me.stats.level}` : '';
  $('day').textContent = state?.calendar ? t('ui.day', state.calendar) : '';
  renderProfile(me);
  if (state) {
    const time = ts => new Date(ts).toLocaleTimeString(i18next.language, { hour: '2-digit', minute: '2-digit' });
    $('log').replaceChildren(...state.log.map(l => el('li', `${time(l.at)} · ${t(l.key, resolve(l.params))}`)));
    $('ideas').replaceChildren(...state.ideas.map(i => el('li', `${i.by}: ${i.text}`)));
  } else { $('log').replaceChildren(); $('ideas').replaceChildren(); }
  draw();
}
function renderProfile(me) {
  const box = $('profile'); box.replaceChildren();
  if (!me) return;
  const s = me.stats, nextXp = 10 * Math.pow(s.level, 2), prevXp = 10 * Math.pow(s.level - 1, 2);
  const row = (label, value) => { const d = el('div'); d.className = 'stat'; d.append(el('span', label), el('b', String(value))); box.append(d); };
  row(t('ui.level'), s.level);
  const bar = el('div'); bar.className = 'bar'; const fill = el('i');
  fill.style.width = `${Math.min(100, ((s.xp - prevXp) / Math.max(1, nextXp - prevXp)) * 100)}%`; bar.append(fill); box.append(bar);
  row(t('ui.xp'), Math.round(s.xp));
  row(t('ui.knowledge'), s.knowledge);
  row(t('ui.success'), s.success);
  row(t('ui.performance'), 'x' + s.performance);
  row('💰', me.coins);
  row('🎭', t(me.role));
}

function draw() {
  if (!viewW) return;
  const ground = viewH - 40, scale = Math.min(1, viewH / 320);
  ctx.clearRect(0, 0, viewW, viewH);
  ctx.font = `${Math.round(12 * Math.max(scale, .85))}px system-ui`;
  ctx.fillStyle = '#555'; ctx.fillRect(0, ground, viewW, 40);
  ctx.fillStyle = '#fff8'; for (let x = -(camX % 60); x < viewW; x += 60) ctx.fillRect(x, ground + 18, 30, 4);
  ctx.fillStyle = '#ffd34d'; ctx.fillRect(20 - camX, ground - 160 * scale, 120, 160 * scale);
  ctx.fillStyle = '#000'; ctx.fillText(t('ui.guideSign'), 36 - camX, ground - 80 * scale);
  const px = 160 - camX, ph = 200 * scale;
  ctx.fillStyle = '#2d9cdb'; ctx.fillRect(px, ground - ph, 120, ph);
  ctx.fillStyle = '#fff'; ctx.fillText(t('ui.plaza'), px + 6, ground - ph + 16);
  if (!state) return;
  const virtual = Object.values(state.companies).filter(c => c.lotId == null);
  ctx.fillText(`🏢 ${virtual.length}`, px + 6, ground - ph + 34);
  virtual.slice(0, 5).forEach((c, i) => ctx.fillText(`· ${companyName(c).slice(0, 15)}`, px + 6, ground - ph + 52 + i * 15));
  state.lots.forEach(lot => {
    const x = LOTS_X + lot.id * (LOT_W + GAP) - camX;
    if (x > viewW || x + LOT_W < 0) return;
    const h = { 10: 90, 50: 130, 100: 170 }[lot.size] * scale, top = ground - h;
    const tenants = lot.companyIds.map(id => state.companies[id]).filter(Boolean);
    const max = lot.type === 'coworking' ? seed.workspaces.coworking.maxTenants : seed.lotSizes[lot.size].maxTenants;
    const mine = tenants.some(c => c.founders.includes(myId()) || c.employees.includes(myId()));
    ctx.fillStyle = lot.type === 'coworking' ? '#1abc9c' : !tenants.length ? '#999' : tenants.some(c => c.isNpc) ? '#b07cff' : '#4caf50';
    ctx.fillRect(x, top, LOT_W, h);
    if (tenants.some(c => c.crisis && c.crisis.until > (state.day || 0))) { ctx.fillStyle = '#e74c3c'; ctx.fillRect(x, top - 6, LOT_W, 6); }
    if (mine) { ctx.strokeStyle = '#ffd34d'; ctx.lineWidth = 3; ctx.strokeRect(x + 1.5, top + 1.5, LOT_W - 3, h - 3); }
    ctx.fillStyle = '#fff';
    ctx.fillText(lot.type === 'coworking' ? t('ui.coworkingSign') : `${lot.size} m²`, x + 6, top + 14);
    ctx.fillText(t('ui.tenants', { n: tenants.length, max }), x + 6, top + 30);
    if (!tenants.length) ctx.fillText(t('ui.emptyLot'), x + 6, top + 46);
    tenants.slice(0, Math.max(0, Math.floor((h - 40) / 15))).forEach((c, i) => ctx.fillText(`· ${companyName(c).slice(0, 20)}`, x + 6, top + 46 + i * 15));
  });
  const endX = LOTS_X + state.lots.length * (LOT_W + GAP) - camX;
  ctx.globalAlpha = .5; ctx.fillStyle = '#ddd'; ctx.fillRect(endX, 20, 400, ground - 20);
  ctx.globalAlpha = 1; ctx.fillStyle = '#333'; ctx.fillText(t('ui.lockedDistrict'), endX + 60, ground / 2);
}

// ---------- Modal ----------
let modalClosable = true;
function openModal(fill, { closable = true } = {}) {
  modalClosable = closable;
  const body = $('modalBody'); body.replaceChildren(); fill(body);
  if (closable) { const b = el('button', t('ui.close')); b.onclick = closeModal; body.append(b); }
  $('modal').style.display = 'flex';
}
const closeModal = () => ($('modal').style.display = 'none');
$('modal').onclick = e => { if (e.target.id === 'modal' && modalClosable) closeModal(); };

function costLabel(ws, lot) {
  if (ws === 'shop') { const base = seed.lotSizes[lot.size].rent, n = lot.companyIds.length + 1; return Math.ceil(base / n) + Math.ceil(base * 0.3 / n); }
  return seed.workspaces[ws].rent + (seed.workspaces[ws].electricity || 0);
}
const depositLabel = (ws, lot) => (ws === 'shop' ? Math.ceil(seed.lotSizes[lot.size].rent / (lot.companyIds.length + 1)) * 5 : seed.workspaces[ws].deposit);

function foundForm(body, { lot = null, choices }) {
  body.append(el('h4', t('ui.foundHere')));
  const wsSel = el('select');
  choices.forEach(ws => wsSel.append(new Option(t('ws.' + ws), ws)));
  const info = el('p');
  const refresh = () => (info.textContent = `${t('ui.deposit', { amount: depositLabel(wsSel.value, lot) })} · ${t('ui.cost', { cost: costLabel(wsSel.value, lot) })}`);
  wsSel.onchange = refresh; refresh();
  const tplSel = el('select');
  seed.templates.forEach((tp, i) => tplSel.append(new Option(`${t(tp.key)} (${t(tp.sector)}, ${tp.price}c)`, i)));
  const nm = el('input'); nm.placeholder = t('ui.companyNamePh'); nm.maxLength = 40;
  if (choices.length > 1) body.append(wsSel);
  body.append(info, tplSel, nm);
  const b = el('button', t('ui.found')); b.className = 'primary';
  b.onclick = () => { socket.emit('found', { lotId: lot?.id ?? null, workspace: wsSel.value, name: nm.value, templateIdx: +tplSel.value }); closeModal(); };
  body.append(b);
}

function benefitsEditor(box, c) {
  box.append(el('h4', t('ui.benefits')));
  const remote = seed.workspaces[c.workspace]?.remote;
  const checks = {};
  for (const k of Object.keys(seed.benefits)) {
    const lab = el('label'); lab.style.display = 'flex'; lab.style.gap = '8px'; lab.style.alignItems = 'center';
    const cb = el('input'); cb.type = 'checkbox'; cb.checked = !!c.benefits?.[k]; cb.style.minHeight = '20px';
    if (k === 'transport' && remote) { cb.disabled = true; cb.checked = false; }
    checks[k] = cb;
    lab.append(cb, el('span', `${t('ben.' + k)} (${seed.benefits[k].cost}c, +${Math.round(seed.benefits[k].perf * 100)}%)`));
    box.append(lab);
  }
  if (remote) box.append(el('p', t('ui.remoteNote')));
  box.append(el('p', `${t('ui.benefitCost', { cost: c.benefitCost || 0 })} · ${t('ui.perfInfo', { perf: c.performance || 1 })}`));
  const save = el('button', t('ui.saveBenefits'));
  save.onclick = () => { socket.emit('setBenefits', { cid: c.id, benefits: Object.fromEntries(Object.entries(checks).map(([k, cb]) => [k, cb.checked])) }); closeModal(); };
  box.append(save);
}

function companyBlock(body, c) {
  const box = el('div'); box.className = 'card'; box.style.background = '#1f2233';
  box.append(el('h4', `${companyName(c)} · ${t('ws.' + c.workspace)}`));
  box.append(el('p', t('ui.info', { price: c.price, cash: c.cash, founders: c.founders.length, employees: c.employees.length })));
  if (c.crisis && c.crisis.until > (state.day || 0)) {
    const mult = { concordat: 0.5, trustee: 0.3, govPressure: 0.7, politicalAttack: 0.6, war: 0.4, cyberAttack: 0.2 }[c.crisis.type];
    const w = el('p', t('ui.inCrisis', { crisis: t('crisis.' + c.crisis.type), mult })); w.style.color = '#ff8a65'; box.append(w);
  }
  const perks = Object.entries(c.benefits || {}).filter(([, on]) => on).map(([k]) => t('ben.' + k)).join(' · ');
  if (perks) box.append(el('p', `🎁 ${perks} · ${t('ui.perfInfo', { perf: c.performance })}`));
  const row = el('div'); row.className = 'row';
  const act = (k, ev, extra = {}, primary) => { const b = el('button', t(k)); if (primary) b.className = 'primary';
    b.onclick = () => { socket.emit(ev, { cid: c.id, ...extra }); closeModal(); }; row.append(b); };
  act('ui.clickSell', 'click', {}, true);
  act('ui.buy', 'buy'); act('ui.cofound', 'cofound'); act('ui.work', 'work');
  act('ui.invest', 'invest', { amount: 100 }); act('ui.withdraw', 'withdraw');
  box.append(row);
  if (c.founders.includes(myId())) benefitsEditor(box, c);
  body.append(box);
}

function onTap(e) {
  if (!state) return showModes();
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left + camX;
  if (x < 150) return openModal(b => { b.append(el('h3', t('ui.guide'))); seed.tutorial.forEach(k => b.append(el('p', t(k)))); });
  if (x >= 160 && x < 280) return openModal(body => {
    body.append(el('h3', t('ui.plazaTitle')));
    const list = Object.values(state.companies).filter(c => c.lotId == null);
    if (!list.length) body.append(el('p', t('ui.noVirtual')));
    list.forEach(c => companyBlock(body, c));
    foundForm(body, { choices: ['home', 'virtual', 'eoffice'] });
  });
  if (x < LOTS_X) return;
  const lot = state.lots[Math.floor((x - LOTS_X) / (LOT_W + GAP))];
  if (!lot) return toast(t('ui.premiumAlert', { feature: t('locked.skyscraper') }));
  const tenants = lot.companyIds.map(id => state.companies[id]).filter(Boolean);
  const max = lot.type === 'coworking' ? seed.workspaces.coworking.maxTenants : seed.lotSizes[lot.size].maxTenants;
  openModal(body => {
    body.append(el('h3', lot.type === 'coworking' ? t('ws.coworking') : `${t('ws.shop')} (${lot.size} m²)`));
    body.append(el('p', t('ui.tenants', { n: tenants.length, max })));
    tenants.forEach(c => companyBlock(body, c));
    if (tenants.length < max) foundForm(body, { lot, choices: [lot.type] });
    else body.append(el('p', t('ui.full')));
  });
}

$('sendText').onclick = () => {
  const text = $('ideaText').value.trim();
  if (!text || !state) return;
  socket.emit('idea', { text }); $('ideaText').value = '';
};
addEventListener('resize', draw);

// ---------- Boot ----------
(async () => {
  const saved = localStorage.getItem('lang') || (navigator.language.startsWith('tr') ? 'tr' : 'en');
  await i18next.init({ lng: saved, fallbackLng: 'tr', resources: {} });
  $('lang').value = saved;
  await loadLang(saved);
  if (!isNarrow()) document.querySelectorAll('#side .card').forEach(c => c.classList.add('active'));
  resize();
  showModes();
})();
function isNarrow() { return matchMedia('(max-width:820px)').matches; }
</script>
</body>
</html>
