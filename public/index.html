<!-- public/index.html -->
<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb">
<title>Finbuu · Fikir Geliştirme ve Değer Önerisi</title>
<link rel="stylesheet" href="/css/game.css">
</head>
<body>
<header>
  <h1><span data-i18n="ui.title"></span><small id="slogan" data-i18n="ui.slogan"></small></h1>
  <span id="day"></span>
  <button id="speedBtn" hidden aria-label="Speed">⏱ 1x</button>
  <span id="clockBox" title=""><canvas id="clock" width="80" height="80" aria-label="clock"></canvas><b id="clockTxt"></b></span>
  <button id="boardBtn" aria-label="Leaderboard">🏆</button>
  <button id="themeBtn" aria-label="Theme">🌓</button>
  <button id="sideBtn" aria-label="Panels" class="deskOnly">▤</button>
  <button id="menuBtn" aria-label="Menu">☰</button>
</header>
<div id="vehBar" hidden></div>
<div id="adBanner" aria-label="Ad"><canvas id="adCv"></canvas></div>
<div id="roomBar"><b id="roomInfo"></b><button id="copyLink" data-i18n="ui.copyLink"></button></div>

<main>
  <section id="stage">
    <canvas id="cv"></canvas>
    <div id="hud" aria-live="polite"></div>
    <div id="advisor" hidden>
      <div id="advText"><b id="advLabel"></b><small id="advReason"></small><small id="advCount" class="muted"></small></div>
      <div class="advBtns">
        <button id="advOk" class="primary" data-i18n="ui.ok"></button>
        <button id="advPrev" aria-label="Previous">◀</button>
        <button id="advNext" data-i18n="ui.next"></button>
        <button id="advAuto" data-i18n="ui.auto"></button>
        <button id="advMin" aria-label="Minimize">▾</button>
      </div>
    </div>
    <button id="advChip" aria-label="Suggestion">💡</button>
    <div id="board" hidden>
      <div class="boardHead">
        <h3 data-i18n="board.title"></h3>
        <select id="boardSort" aria-label="Sort">
          <option value="cash" data-i18n="board.byCash"></option>
          <option value="month" data-i18n="board.byMonth"></option>
          <option value="sales" data-i18n="board.bySales"></option>
          <option value="staff" data-i18n="board.byStaff"></option>
          <option value="teams" data-i18n="board.byTeams"></option>
        </select>
        <button id="boardClose" aria-label="Close">✕</button>
      </div>
      <div class="boardScroll"><table id="boardTable"></table></div>
      <small class="muted" data-i18n="board.hint"></small>
    </div>
    <div id="innerBar" hidden>
      <b id="innerTitle"></b>
      <button id="floorUp" aria-label="Floor up">▲</button>
      <button id="floorDown" aria-label="Floor down">▼</button>
      <button id="exitBtn" data-i18n="ui.exit"></button>
    </div>
    <div id="joy" hidden><div id="knob"></div></div>
    <button id="talkBtn" hidden></button>
    <button id="actBtn" hidden></button>
    <button id="hudBtn" aria-label="HUD">▾</button>
    <button id="mapBtn" aria-label="Map" title="M">🗺</button>
    <div id="minimap" hidden>
      <div class="mmHead"><b data-i18n="map.title"></b><button id="mmClose" aria-label="Close">✕</button></div>
      <canvas id="mmCv"></canvas>
      <div id="mmList"></div>
    </div>
    <span id="hint"></span>
    <div id="status" aria-live="off"></div>
  </section>
  <aside id="side">
    <div class="card" data-panel="chat" id="chatCard" hidden>
      <h3 data-i18n="ui.chat"></h3>
      <div id="pollBox"></div>
      <ul id="chatList"></ul>
      <div id="emojiBar" class="emojiBar" aria-label="Emoji"></div>
      <div class="row chatRow">
        <input id="chatInput" maxlength="200" data-i18n-ph="ui.chatPh" autocomplete="off">
        <button id="chatSend" class="primary" data-i18n="ui.sendText"></button>
      </div>
      <div class="row"><button id="wizardBtn" data-i18n="wiz.open"></button></div>
    </div>
    <div class="card" data-panel="finance">
      <h3 data-i18n="ui.finance"></h3>
      <select id="finCompany" aria-label="Company"></select>
      <p id="finEmpty" class="muted"></p>
      <div id="finBody">
        <div class="kpiGroup"><h4 data-i18n="ui.finNow"></h4><div class="kpis" id="kpiNow"></div></div>
        <div class="kpiGroup"><h4 data-i18n="ui.finMonth"></h4><div class="kpis" id="kpiMonth"></div></div>
        <figure><figcaption data-i18n="ui.chartCash"></figcaption><div class="chartBox"><canvas id="chCash"></canvas></div></figure>
        <figure><figcaption data-i18n="ui.chartDaily"></figcaption><div class="chartBox"><canvas id="chDaily"></canvas></div></figure>
        <figure><figcaption data-i18n="ui.chartMonthly"></figcaption><div class="chartBox"><canvas id="chMonthly"></canvas></div></figure>
        <details><summary data-i18n="ui.tableView"></summary><table id="finTable"></table></details>
      </div>
    </div>
    <div class="card" data-panel="profile"><h3 data-i18n="ui.profile"></h3><div id="profile"></div>
      <h3 style="margin-top:12px" data-i18n="quest.title"></h3><div id="quests"></div>
      <h3 style="margin-top:12px" data-i18n="team.title"></h3><div id="teams"></div>
      <h3 style="margin-top:12px" data-i18n="badge.title"></h3><div id="badges" class="badges"></div></div>
    <div class="card" data-panel="events"><h3 data-i18n="ui.events"></h3><ul id="log"></ul></div>
    <div class="card" data-panel="guide"><h3 data-i18n="ui.guide"></h3><ol id="tut"></ol>
      <h3 style="margin-top:12px" data-i18n="real.title"></h3><div id="realData"></div>
      <h3 style="margin-top:12px" data-i18n="ui.premium"></h3><div id="locked"></div></div>
    <div class="card" data-panel="ideas"><h3 data-i18n="ui.ideaBox"></h3>
      <textarea id="ideaText" maxlength="500" data-i18n-ph="ui.ideaPh"></textarea>
      <div class="row" style="margin:8px 0">
        <button id="sendText" class="primary" data-i18n="ui.sendText"></button>
        <button id="recAudio" class="lockedBtn"></button>
        <button id="recVideo" class="lockedBtn"></button>
      </div>
      <ul id="ideas"></ul></div>
  </aside>
</main>

<nav>
  <button data-tab="street" class="active"><span>🏙</span><b data-i18n="ui.tabStreet"></b></button>
  <button data-tab="finance"><span>📊</span><b data-i18n="ui.tabFinance"></b></button>
  <button data-tab="chat"><span>💬</span><b data-i18n="ui.tabChat"></b></button>
  <button data-tab="profile"><span>👤</span><b data-i18n="ui.tabProfile"></b></button>
  <button data-tab="events"><span>📰</span><b data-i18n="ui.tabEvents"></b></button>
  <button data-tab="menu"><span>☰</span><b data-i18n="ui.menu"></b></button>
</nav>

<div id="scrim"></div>
<div id="drawer">
  <h3 data-i18n="ui.settings"></h3>
  <label data-i18n="ui.language"></label>
  <select id="lang"><option value="tr">Türkçe</option><option value="en">English</option></select>
  <label data-i18n="ui.quality"></label>
  <select id="quality">
    <option value="auto" data-i18n="ui.qAuto"></option>
    <option value="high" data-i18n="ui.qHigh"></option>
    <option value="low" data-i18n="ui.qLow"></option>
  </select>
  <button id="toggleStatus" data-i18n="ui.toggleStatus"></button>
  <button id="openGuide" data-i18n="ui.guide"></button>
  <button id="openIdeas" data-i18n="ui.ideaBox"></button>
  <button id="openModes" class="primary" data-i18n="ui.modeTitle"></button>
  <button id="closeDrawer" data-i18n="ui.close"></button>
</div>

<div id="modal"><div class="card" id="modalBody" role="dialog" aria-modal="true"></div></div>
<div id="mapOverlay" hidden></div>
<div id="travelOverlay" hidden></div>
<div id="toast"></div>

<script src="/vendor/i18next/i18next.min.js"></script>
<script src="/vendor/chart.js/chart.umd.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
