<!-- public/index.html -->
<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb">
<title>Finbuu</title>
<link rel="stylesheet" href="/css/game.css">
</head>
<body>
<header>
  <h1 data-i18n="ui.title"></h1>
  <span id="day"></span>
  <button id="menuBtn" aria-label="Menu">☰</button>
</header>
<div id="roomBar"><b id="roomInfo"></b><button id="copyLink" data-i18n="ui.copyLink"></button></div>

<main>
  <section id="stage">
    <canvas id="cv"></canvas>
    <div id="hud" aria-live="polite"></div>
    <div id="advisor" hidden>
      <div id="advText"><b id="advLabel"></b><small id="advReason"></small></div>
      <div class="advBtns">
        <button id="advOk" class="primary" data-i18n="ui.ok"></button>
        <button id="advNext" data-i18n="ui.next"></button>
        <button id="advAuto" data-i18n="ui.auto"></button>
      </div>
    </div>
    <div id="joy" hidden><div id="knob"></div></div>
    <button id="actBtn" hidden></button>
    <span id="hint"></span>
  </section>
  <aside id="side">
    <div class="card" data-panel="finance">
      <h3 data-i18n="ui.finance"></h3>
      <select id="finCompany" aria-label="Company"></select>
      <p id="finEmpty" class="muted"></p>
      <div id="finBody">
        <div class="kpiGroup"><h4 data-i18n="ui.finNow"></h4><div class="kpis" id="kpiNow"></div></div>
        <div class="kpiGroup"><h4 data-i18n="ui.finMonth"></h4><div class="kpis" id="kpiMonth"></div></div>
        <figure><figcaption data-i18n="ui.chartCash"></figcaption><div class="chartBox"><canvas id="chCash"></canvas></div></figure>
        <figure><figcaption data-i18n="ui.chartDaily"></figcaption><div class="chartBox"><canvas id="chDaily"></canvas></div></figure>
        <figure><figcaption data-i18n="ui.chartMonthly"></figcaption><div class="chartBox"><canvas id="chMonthly"></canvas></div></figure>
        <details><summary data-i18n="ui.tableView"></summary><table id="finTable"></table></details>
      </div>
    </div>
    <div class="card" data-panel="profile"><h3 data-i18n="ui.profile"></h3><div id="profile"></div></div>
    <div class="card" data-panel="guide"><h3 data-i18n="ui.guide"></h3><ol id="tut"></ol>
      <h3 style="margin-top:12px" data-i18n="ui.premium"></h3><div id="locked"></div></div>
    <div class="card" data-panel="ideas"><h3 data-i18n="ui.ideaBox"></h3>
      <textarea id="ideaText" maxlength="500" data-i18n-ph="ui.ideaPh"></textarea>
      <div class="row" style="margin:8px 0">
        <button id="sendText" class="primary" data-i18n="ui.sendText"></button>
        <button id="recAudio" class="lockedBtn"></button>
        <button id="recVideo" class="lockedBtn"></button>
      </div>
      <ul id="ideas"></ul></div>
    <div class="card" data-panel="events"><h3 data-i18n="ui.events"></h3><ul id="log"></ul></div>
  </aside>
</main>

<nav>
  <button data-tab="street" class="active"><span>🏙</span><b data-i18n="ui.tabStreet"></b></button>
  <button data-tab="finance"><span>📊</span><b data-i18n="ui.tabFinance"></b></button>
  <button data-tab="profile"><span>👤</span><b data-i18n="ui.tabProfile"></b></button>
  <button data-tab="guide"><span>📘</span><b data-i18n="ui.tabGuide"></b></button>
  <button data-tab="events"><span>📰</span><b data-i18n="ui.tabEvents"></b></button>
  <button data-tab="menu"><span>☰</span><b data-i18n="ui.menu"></b></button>
</nav>

<div id="scrim"></div>
<div id="drawer">
  <h3 data-i18n="ui.settings"></h3>
  <label data-i18n="ui.language"></label>
  <select id="lang"><option value="tr">Türkçe</option><option value="en">English</option></select>
  <button id="openIdeas" data-i18n="ui.ideaBox"></button>
  <button id="openModes" class="primary" data-i18n="ui.modeTitle"></button>
  <button id="closeDrawer" data-i18n="ui.close"></button>
</div>

<div id="modal"><div class="card" id="modalBody" role="dialog" aria-modal="true"></div></div>
<div id="toast"></div>

<script src="/vendor/i18next/i18next.min.js"></script>
<script src="/vendor/chart.js/chart.umd.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
